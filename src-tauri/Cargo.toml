[package]
name = "student-grouper"
version = "0.1.0"
description = "Local-first classroom grouping and station rotation planner"
authors = ["ExCodeCowboy"]
license = ""
repository = "https://github.com/ExCodeCowboy/StudentGrouper"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "student_grouper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
tauri = { version = "2.11.3" }
