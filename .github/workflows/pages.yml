name: Publish the browser app

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - name: Build the browser app
        run: npm run build
        env:
          VITE_BASE_PATH: /StudentGrouper/app/
      - name: Assemble the public site
        shell: bash
        run: |
          mkdir -p pages-dist/app
          cp -R public-site/. pages-dist/
          cp website/app/globals.css pages-dist/site.css
          cp website/public/favicon.svg pages-dist/favicon.svg
          cp website/public/og.png pages-dist/og.png
          cp -R dist/. pages-dist/app/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: pages-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
