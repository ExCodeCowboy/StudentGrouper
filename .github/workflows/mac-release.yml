name: Build the Mac downloads

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    name: ${{ matrix.name }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Older Intel Macs
            target: x86_64-apple-darwin
          - name: Apple silicon Macs
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - run: npm ci
      - run: npm test
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: '-'
        with:
          tagName: v__VERSION__
          releaseName: Student Grouper v__VERSION__
          releaseBody: |
            A confetti student picker and a reveal display fix for Student Grouper 0.3.3.

            - Open Student view and choose Pick a student for a quick random choice with a large name display and a confetti reveal.
            - Every present student has an equal chance on each draw, including students who are not assigned to a group. Absent students are excluded, and Pick again starts a fresh draw.
            - Move between Groups, Today, and Pick a student without leaving student view. The picker keeps the shared reveal-sound mute preference and respects reduced motion without changing the selected effect for groups or rotations.
            - Reveal animations no longer produce an unwanted horizontal scrollbar. Wide daily rotation charts still scroll normally.

            Saved classrooms and earlier exports remain compatible. No group arrangement or planned day is needed to use the picker. All nine reveal effects and existing rotation timers and transition music remain available.

            Mac downloads:

            - Choose `Student-Grouper-x64.dmg` for an older Intel MacBook Air.
            - Choose `Student-Grouper-aarch64.dmg` for an M1 or newer Mac.
            - This early build is ad-hoc signed rather than Apple-notarized. On first launch, Control-click the app, choose Open, and confirm.

            Student data stays on the device. Export a backup before moving classroom data between devices.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: false
          releaseAssetNamePattern: Student-Grouper-[arch].[ext]
          args: --target ${{ matrix.target }}
