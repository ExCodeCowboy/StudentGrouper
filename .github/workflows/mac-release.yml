name: Build the Mac downloads

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    name: ${{ matrix.name }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Older Intel Macs
            target: x86_64-apple-darwin
          - name: Apple silicon Macs
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - run: npm ci
      - run: npm test
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: '-'
        with:
          tagName: v__VERSION__
          releaseName: Student Grouper v__VERSION__
          releaseBody: |
            Starter stars, richer transition music, and classroom refinements for Student Grouper 0.3.1.

            - Pairs get one randomly chosen starter, marked with a gold star beside their name in the teacher and student group views. The choice stays the same through reveals and reopening; making pairs again draws fresh starters. Odd-numbered trios get one starter too.
            - Choose five rich songs: Bells, Oboe, Strings, Guitar, and Koto. The four synthesized tunes are labeled (minimal). Built-in music offers 30, 45, 60, 90, or 120 seconds, with gentle fades when recordings are shortened. All nine choices work offline in the Mac app.
            - Saving a new rotation duration immediately updates the countdown. Running timers continue from the new time; paused timers stay paused. Music-only edits preserve progress.
            - Next round is the main action when a round ends, with Restart round as the secondary option. A compact date and title leave more room for the rotation chart.
            - Existing classroom exports remain compatible, including saved pair starters and music preferences. Earlier pairs receive starters without changing their partners.

            For starters, choose Groups → Pairs → Make groups. For music, choose Today → Student view → Timer & transition. Automatic music is off by default. YouTube keeps its own video length, needs internet, and may restrict playback. No camera or microphone is used.

            Mac downloads:

            - Choose `Student-Grouper-x64.dmg` for an older Intel MacBook Air.
            - Choose `Student-Grouper-aarch64.dmg` for an M1 or newer Mac.
            - This early build is ad-hoc signed rather than Apple-notarized. On first launch, Control-click the app, choose Open, and confirm.

            Student data stays on the device. Export a backup before moving classroom data between devices.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: false
          releaseAssetNamePattern: Student-Grouper-[arch].[ext]
          args: --target ${{ matrix.target }}
