name: Build the Mac downloads

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    name: ${{ matrix.name }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Older Intel Macs
            target: x86_64-apple-darwin
          - name: Apple silicon Macs
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - run: npm ci
      - run: npm test
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: '-'
        with:
          tagName: v__VERSION__
          releaseName: Student Grouper v__VERSION__
          releaseBody: |
            Rotation timers and transition music for Student Grouper 0.3.0.

            - Use a silent rotation countdown with pause, resume, reset, extra time, and teacher-controlled next rounds.
            - Choose four familiar public-domain melodies with gentle accompaniment, lasting 30, 45, or 60 seconds. They work offline and leave the rotation chart visible.
            - Play an embedded YouTube transition video, with an optional automatic start when time is up and a built-in tune if the video cannot play.
            - Save timer and music preferences per class. Existing classroom backups remain compatible.
            - Keep all the block planning, flexible station pins, group themes, and animated student reveals from 0.2.0.

            To set up: Today → Student view → Timer & transition. Automatic music is off by default. YouTube needs internet and may restrict playback; built-in tunes are the offline option. No camera or microphone is used.

            Mac downloads:

            - Choose `Student-Grouper-x64.dmg` for an older Intel MacBook Air.
            - Choose `Student-Grouper-aarch64.dmg` for an M1 or newer Mac.
            - This early build is ad-hoc signed rather than Apple-notarized. On first launch, Control-click the app, choose Open, and confirm.

            Student data stays on the device. Export a backup before moving classroom data between devices.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: false
          releaseAssetNamePattern: Student-Grouper-[arch].[ext]
          args: --target ${{ matrix.target }}
