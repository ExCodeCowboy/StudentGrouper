name: Build the Mac downloads

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    name: ${{ matrix.name }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Older Intel Macs
            target: x86_64-apple-darwin
          - name: Apple silicon Macs
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - run: npm ci
      - run: npm test
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: '-'
        with:
          tagName: v__VERSION__
          releaseName: Student Grouper v__VERSION__
          releaseBody: |
            Thirteen redesigned classroom reveals for Student Grouper 0.4.0.

            - New reveals: Pixel Quest (a level-clear platformer), Block mine (dig and build), a hard Dot-to-dot that keeps the picture a mystery until the end, Dino egg hatch, Wizard owl with magic letters, and Squishy bounce.
            - Rebuilt favorites: a 3-2-1 countdown and storybook Saturn V moon landing, a hungry Black-hole that burps out sparkles, Kitten & yarn, Balloon pop party, Fairy dust, Ocean wave with a surfing otter, and a bigger Confetti party for Pick a student.
            - Every reveal has a matching sound and finishes within ten seconds. Rainbow zipper and Dragon hiccup have been retired; a saved choice for either falls back to Surprise me!.

            Saved classrooms and earlier exports remain compatible. Reduced motion, the reveal sound mute, rotation timers and transition music work as before.

            Mac downloads:

            - Choose `Student-Grouper-x64.dmg` for an older Intel MacBook Air.
            - Choose `Student-Grouper-aarch64.dmg` for an M1 or newer Mac.
            - This early build is ad-hoc signed rather than Apple-notarized. On first launch, Control-click the app, choose Open, and confirm.

            Student data stays on the device. Export a backup before moving classroom data between devices.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: false
          releaseAssetNamePattern: Student-Grouper-[arch].[ext]
          args: --target ${{ matrix.target }}
