name: Build the Mac downloads

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    name: ${{ matrix.name }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Older Intel Macs
            target: x86_64-apple-darwin
          - name: Apple silicon Macs
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - run: npm ci
      - run: npm test
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: '-'
        with:
          tagName: v__VERSION__
          releaseName: Student Grouper v__VERSION__
          releaseBody: |
            Classroom presentation improvements and gentle reveal sounds for Student Grouper 0.3.2.

            - Switch between Groups and Today and rebuild groups while remaining in student view. Compact controls leave more room for the classroom display.
            - Group assignment shuffles within matching buckets, and priority stations help the planner schedule essential activities sooner.
            - Cat & yarn and Saturn V moon-landing reveals join the effect library, with refined character motion and a naturally scattered star field.
            - All nine reveals have short, bundled CC0 sound effects. Highlights include a cat mew, fairy giggle, rocket roar shaped for small speakers, and a drum roll into a trumpet ta-da for confetti.
            - A small speaker control mutes reveal sounds across Groups and Today. Sounds stop when the reveal is hidden or closed and work offline in the Mac app.
            - Saved classrooms and earlier exports remain compatible. Pair starter stars, rotation timers, and all nine transition music choices remain available.

            Open Student view and choose a reveal from the arrow beside the Reveal button. The speaker beside it controls reveal sounds; Timer & transition retains its separate music controls. Sound creators and source licenses are included with the app.

            Mac downloads:

            - Choose `Student-Grouper-x64.dmg` for an older Intel MacBook Air.
            - Choose `Student-Grouper-aarch64.dmg` for an M1 or newer Mac.
            - This early build is ad-hoc signed rather than Apple-notarized. On first launch, Control-click the app, choose Open, and confirm.

            Student data stays on the device. Export a backup before moving classroom data between devices.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: false
          releaseAssetNamePattern: Student-Grouper-[arch].[ext]
          args: --target ${{ matrix.target }}
